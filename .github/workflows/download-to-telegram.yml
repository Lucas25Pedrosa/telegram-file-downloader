name: Download to Telegram

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "URL direta do arquivo"
        required: true
        type: string

      file_name:
        description: "Nome do arquivo (opcional)"
        required: false
        type: string

concurrency:
  group: telegram-downloader
  cancel-in-progress: false

jobs:
  download-and-send:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install telethon requests

      - name: Baixar e enviar para o Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FILE_URL: ${{ inputs.file_url }}
          FILE_NAME: ${{ inputs.file_name }}
        run: |
          python - <<'PY'
          import asyncio
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlparse, unquote

          import requests
          from telethon import TelegramClient
          from telethon.sessions import StringSession


          API_ID = int(os.environ["TELEGRAM_API_ID"])
          API_HASH = os.environ["TELEGRAM_API_HASH"]
          SESSION = os.environ["TELEGRAM_SESSION"]
          CHAT_ID = int(os.environ["TELEGRAM_CHAT_ID"])

          FILE_URL = os.environ["FILE_URL"].strip()
          CUSTOM_NAME = os.environ.get("FILE_NAME", "").strip()

          DOWNLOAD_DIR = Path("downloads")
          DOWNLOAD_DIR.mkdir(exist_ok=True)


          def safe_filename(name):
              name = name.strip()
              name = re.sub(r'[\\/:*?"<>|]', "_", name)
              return name or "downloaded_file"


          def filename_from_url(url):
              path = unquote(urlparse(url).path)
              name = Path(path).name
              return safe_filename(name) if name else "downloaded_file"


          filename = safe_filename(CUSTOM_NAME) if CUSTOM_NAME else filename_from_url(FILE_URL)
          filepath = DOWNLOAD_DIR / filename

          print(f"Baixando: {FILE_URL}")
          print(f"Arquivo: {filepath}")

          headers = {
              "User-Agent": "Mozilla/5.0"
          }

          with requests.get(
              FILE_URL,
              stream=True,
              allow_redirects=True,
              timeout=(30, 300),
              headers=headers
          ) as response:

              response.raise_for_status()

              total = int(response.headers.get("content-length", 0))
              downloaded = 0

              with open(filepath, "wb") as f:
                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                      if chunk:
                          f.write(chunk)
                          downloaded += len(chunk)

                          if total:
                              percent = downloaded * 100 / total
                              print(
                                  f"\rDownload: {percent:.1f}% "
                                  f"({downloaded / 1024 / 1024:.1f} MB / "
                                  f"{total / 1024 / 1024:.1f} MB)",
                                  end="",
                                  flush=True
                              )

          print()
          print(f"Download concluído: {filepath.stat().st_size / 1024 / 1024:.1f} MB")


          async def main():
              client = TelegramClient(
                  StringSession(SESSION),
                  API_ID,
                  API_HASH
              )

              await client.connect()

              if not await client.is_user_authorized():
                  raise RuntimeError("TELEGRAM_SESSION não está autenticada.")

              me = await client.get_me()
              print(f"Conectado ao Telegram como: {me.first_name}")

              print("Enviando arquivo para o Telegram...")

              await client.send_file(
                  CHAT_ID,
                  str(filepath),
                  caption=f"📦 {filename}",
                  force_document=True
              )

              print("Arquivo enviado com sucesso.")

              await client.disconnect()


          asyncio.run(main())

          try:
              filepath.unlink()
              print("Arquivo temporário apagado.")
          except Exception as exc:
              print(f"Não foi possível apagar o arquivo temporário: {exc}")

          PY
